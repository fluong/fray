name: Fray
description: >
  Parse a Terraform plan into a DFD, scan it with the hosted Fray API (GitHub
  Actions OIDC, audience fray), update a single PR comment, and upload SARIF.
author: fluong

branding:
  icon: shield
  color: gray-dark

inputs:
  api-url:
    description: >
      Fray API base URL (for example https://api.example.com).
      Required — never commit a production URL into the Action repository.
    required: true
  working-directory:
    description: Terraform root module directory (contains .tf sources).
    required: false
    default: "."
  config:
    description: Path to fray.yaml (relative to the GitHub workspace).
    required: false
    default: "fray.yaml"

runs:
  using: composite
  steps:
    - name: Detect fork pull request
      id: fork
      shell: bash
      run: |
        set -euo pipefail
        is_fork=false
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            is_fork=true
          fi
        fi
        echo "is_fork=${is_fork}" >> "$GITHUB_OUTPUT"

    - name: Skip Fray on fork PR (no OIDC)
      if: steps.fork.outputs.is_fork == 'true'
      shell: bash
      run: |
        set -euo pipefail
        msg='Fray did not run: fork pull requests cannot request an OIDC token with audience "fray". Open the PR from a branch in this repository to scan.'
        echo "::warning::$msg"
        {
          echo "## Fray"
          echo ""
          echo "$msg"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Setup Go
      if: steps.fork.outputs.is_fork != 'true'
      uses: actions/setup-go@v5
      with:
        go-version: "1.22.x"
        cache-dependency-path: ${{ github.action_path }}/go.sum

    - name: Setup Terraform
      if: steps.fork.outputs.is_fork != 'true'
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Build fray client
      if: steps.fork.outputs.is_fork != 'true'
      id: build
      shell: bash
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/fray-bin"
        mkdir -p "$out"
        (cd "${{ github.action_path }}" && go build -o "$out/fray" ./cmd/fray)
        echo "bin=$out/fray" >> "$GITHUB_OUTPUT"

    - name: Request OIDC token (aud=fray)
      if: steps.fork.outputs.is_fork != 'true'
      id: oidc
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "::error::Missing Actions ID token endpoints. Grant permissions: id-token: write"
          exit 2
        fi
        token="$(curl -fsSL \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          -H "Accept: application/json; api-version=2.0" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fray" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
        if [[ -z "$token" ]]; then
          echo "::error::Empty OIDC token for audience fray"
          exit 2
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Terraform plan and Fray scan
      if: steps.fork.outputs.is_fork != 'true'
      id: scan
      shell: bash
      env:
        FRAY_BIN: ${{ steps.build.outputs.bin }}
        FRAY_API_URL: ${{ inputs.api-url }}
        FRAY_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        FRAY_WORKDIR: ${{ inputs.working-directory }}
        FRAY_CONFIG: ${{ inputs.config }}
        FRAY_OUT: ${{ runner.temp }}/fray-out
      run: bash "${{ github.action_path }}/action/scan.sh"

    - name: Update PR comment
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        github.event_name == 'pull_request' &&
        steps.scan.outputs.has_comment == 'true'
      uses: actions/github-script@v7
      env:
        FRAY_COMMENT_PATH: ${{ runner.temp }}/fray-out/pr-comment.md
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- fray -->';
          const body = marker + '\n' + fs.readFileSync(process.env.FRAY_COMMENT_PATH, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
          }

    - name: Upload SARIF
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        steps.scan.outputs.has_sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/fray-out/findings.sarif
        category: fray

    - name: Gate
      if: steps.fork.outputs.is_fork != 'true'
      shell: bash
      env:
        FRAY_BLOCKED: ${{ steps.scan.outputs.blocked }}
      run: |
        set -euo pipefail
        if [[ "${FRAY_BLOCKED}" == "true" ]]; then
          echo "::error::Fray gate blocked this change (new high-severity findings vs baseline)."
          exit 1
        fi
        echo "Fray gate passed."
