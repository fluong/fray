name: Fray
description: >
  Parse a Terraform plan into a DFD, scan it with the hosted Fray API (GitHub
  Actions OIDC, audience fray), update a single PR comment, and upload SARIF.
author: fluong

branding:
  icon: shield
  color: gray-dark

inputs:
  api-url:
    description: >
      Fray API base URL (https://api.getfray.dev). Required — do not use a
      *.run.app URL in workflows or docs.
    required: true
  working-directory:
    description: Terraform root module directory (contains .tf sources).
    required: false
    default: "."
  config:
    description: Path to fray.yaml (relative to the GitHub workspace).
    required: false
    default: "fray.yaml"
  waivers-file:
    description: >
      Path to .fray/waivers.yml (relative to the GitHub workspace). Missing file
      means no waivers. See README Waivers section.
    required: false
    default: ".fray/waivers.yml"
  redaction-key:
    description: >
      32-byte hex HMAC key (from secrets.FRAY_REDACTION_KEY). Required unless
      fray.yaml sets redaction: off. Identifying fields are hashed before POST;
      the key never leaves CI.
    required: false
    default: ""
  show-payload:
    description: >
      When true, upload the exact JSON POST body as a workflow artifact
      (fray-payload) so you can audit what Fray received.
    required: false
    default: "false"
  fail-on-unenrolled:
    description: >
      When true, fail the job if the Fray GitHub App is not installed, this
      repository is not selected, or the installation is over the free-plan
      repo cap. Default false: emit a warning, write the job summary, and
      skip the scan (no SARIF, no PR comment) with exit 0.
    required: false
    default: "false"
  fail-on-rate-limit:
    description: >
      When true, fail the job if the hosted API returns HTTP 429 rate_limited.
      Default false: emit a warning (with retry-after), write the job summary,
      and skip the scan (no SARIF, no PR comment) with exit 0. Also covered when
      fail-on-skip is true.
    required: false
    default: "false"
  fail-on-skip:
    description: >
      When true, fail the job on any soft-skip (enrollment rejection or rate
      limit). Default false: emit a warning annotation and job summary, exit 0.
      Covers the same rate-limit soft-skip as fail-on-rate-limit when true.
    required: false
    default: "false"
  upload-sarif:
    description: >
      When true (default), upload findings.sarif to GitHub Code Scanning via
      github/codeql-action/upload-sarif. Requires workflow permission
      security-events: write. Set false to keep the file locally without
      uploading.
    required: false
    default: "true"
  plan-file:
    description: >
      Path to a terraform show -json plan file, relative to working-directory.
      When set, skips setup-terraform / terraform init / plan / show and scans
      that file instead. The plan JSON contains secrets in plaintext — keep
      artifact retention short and never upload it from fork PRs. Omit to run
      terraform in this job (default).
    required: false
    default: ""

outputs:
  has-sarif:
    description: Whether findings.sarif was written (true/false).
    value: ${{ steps.scan.outputs.has_sarif }}
  sarif-file:
    description: Absolute path to findings.sarif when has-sarif is true; empty otherwise.
    value: ${{ steps.scan.outputs.sarif_file }}

runs:
  using: composite
  steps:
    - name: Detect fork pull request
      id: fork
      shell: bash
      run: |
        set -euo pipefail
        is_fork=false
        if [[ "${{ github.event_name }}" == "pull_request" ]]; then
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            is_fork=true
          fi
        fi
        echo "is_fork=${is_fork}" >> "$GITHUB_OUTPUT"

    - name: Skip Fray on fork PR (no OIDC)
      if: steps.fork.outputs.is_fork == 'true'
      shell: bash
      run: |
        set -euo pipefail
        msg='Fray did not run: fork pull requests cannot request an OIDC token with audience "fray". Open the PR from a branch in this repository to scan.'
        echo "::warning::$msg"
        {
          echo "## Fray"
          echo ""
          echo "$msg"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Setup Go
      if: steps.fork.outputs.is_fork != 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Absolute path: setup-go reads the file via existsSync (works outside
        # GITHUB_WORKSPACE). Module cache still does not — keep cache off.
        go-version-file: ${{ github.action_path }}/go.mod
        cache: false
      env:
        GOTOOLCHAIN: local

    - name: Setup Terraform
      if: steps.fork.outputs.is_fork != 'true' && inputs.plan-file == ''
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_wrapper: false

    - name: Build fray client
      if: steps.fork.outputs.is_fork != 'true'
      id: build
      shell: bash
      env:
        # Use only the Go installed by setup-go; never download a toolchain at runtime.
        GOTOOLCHAIN: local
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP}/fray-bin"
        mkdir -p "$out"
        (cd "${{ github.action_path }}" && go build -o "$out/fray" ./cmd/fray)
        echo "bin=$out/fray" >> "$GITHUB_OUTPUT"

    - name: Request OIDC token (aud=fray)
      if: steps.fork.outputs.is_fork != 'true'
      id: oidc
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
          echo "::error::Missing Actions ID token endpoints. Grant permissions: id-token: write. See https://github.com/fluong/fray#troubleshooting."
          exit 2
        fi
        token="$(curl -fsSL \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          -H "Accept: application/json; api-version=2.0" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fray" \
          | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
        if [[ -z "$token" ]]; then
          echo "::error::Empty OIDC token for audience \"fray\". Confirm permissions include id-token: write and that this is not a fork PR. See https://github.com/fluong/fray#troubleshooting."
          exit 2
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"

    - name: Fray scan
      if: steps.fork.outputs.is_fork != 'true'
      id: scan
      shell: bash
      env:
        FRAY_BIN: ${{ steps.build.outputs.bin }}
        FRAY_API_URL: ${{ inputs.api-url }}
        FRAY_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        FRAY_WORKDIR: ${{ inputs.working-directory }}
        FRAY_CONFIG: ${{ inputs.config }}
        FRAY_WAIVERS_FILE: ${{ inputs.waivers-file }}
        FRAY_OUT: ${{ runner.temp }}/fray-out
        FRAY_REDACTION_KEY: ${{ inputs.redaction-key }}
        FRAY_SHOW_PAYLOAD: ${{ inputs.show-payload }}
        FRAY_FAIL_ON_UNENROLLED: ${{ inputs.fail-on-unenrolled }}
        FRAY_FAIL_ON_RATE_LIMIT: ${{ inputs.fail-on-rate-limit }}
        FRAY_FAIL_ON_SKIP: ${{ inputs.fail-on-skip }}
        FRAY_PLAN_FILE: ${{ inputs.plan-file }}
      run: bash "${{ github.action_path }}/action/scan.sh"

    - name: Upload sent payload
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        steps.scan.outputs.skipped != 'true' &&
        inputs.show-payload == 'true' &&
        steps.scan.outputs.has_payload == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fray-payload
        path: ${{ runner.temp }}/fray-out/payload.json
        if-no-files-found: warn

    - name: Update PR comment
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        steps.scan.outputs.skipped != 'true' &&
        github.event_name == 'pull_request' &&
        steps.scan.outputs.has_comment == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        FRAY_COMMENT_PATH: ${{ runner.temp }}/fray-out/pr-comment.md
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- fray -->';
          const body = marker + '\n' + fs.readFileSync(process.env.FRAY_COMMENT_PATH, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner, repo, issue_number, per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner, repo, issue_number, body,
            });
          }

    - name: Upload SARIF
      id: upload-sarif
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        steps.scan.outputs.skipped != 'true' &&
        steps.scan.outputs.has_sarif == 'true' &&
        inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        sarif_file: ${{ runner.temp }}/fray-out/findings.sarif
        category: fray

    - name: Warn on SARIF upload failure
      if: steps.upload-sarif.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::SARIF upload failed — grant \`security-events: write\` to the workflow, and enable code scanning for private repos"

    - name: Gate
      if: >-
        steps.fork.outputs.is_fork != 'true' &&
        steps.scan.outputs.skipped != 'true'
      shell: bash
      env:
        FRAY_BLOCKED: ${{ steps.scan.outputs.blocked }}
      run: |
        set -euo pipefail
        if [[ "${FRAY_BLOCKED}" == "true" ]]; then
          echo "::error::Fray gate blocked this change (new high-severity findings vs baseline). Review the Fray PR comment (or findings.sarif). To accept risk, add an entry under .fray/waivers.yml (see README Waivers). A default-branch scan sets the merge baseline. See https://github.com/fluong/fray#troubleshooting."
          exit 1
        fi
        echo "Fray gate passed."
