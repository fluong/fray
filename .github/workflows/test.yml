name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label (e.g. ubuntu-26.04, ubuntu-latest)
        required: false
        default: ubuntu-26.04
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-26.04' }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
        env:
          GOTOOLCHAIN: local

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1
