name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner label (e.g. ubuntu-latest, ubuntu-26.04)
        required: false
        default: ubuntu-latest
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1
